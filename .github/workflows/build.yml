name: Build Seedling
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release (v<VERSION>) with the installers'
        type: boolean
        default: false

permissions:
  contents: write

env:
  VERSION: "0.5.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure (JUCE 8.0.4 is downloaded automatically)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"   # universal: Apple Silicon + Intel
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi
      - name: Saved-seed compatibility test (old seeds must still grow the same patches)
        run: |
          cmake --build build --config Release --target seed_compat_test
          ctest --test-dir build -C Release -R seed_compat --output-on-failure
      - name: Reverb test (decay time, damping, stability)
        run: |
          cmake --build build --config Release --target seed_reverb_test
          ctest --test-dir build -C Release -R seed_reverb --output-on-failure
      - name: Seed palette test (every seed must give readable colours)
        run: |
          cmake --build build --config Release --target seed_palette_test
          ctest --test-dir build -C Release -R seed_palette --output-on-failure
      - name: Wavetable import test (tables, sampled sounds, auto-tune)
        run: |
          cmake --build build --config Release --target seed_wavetable_test
          ctest --test-dir build -C Release -R seed_wavetable --output-on-failure
      - name: Archetype test (recipes, sources, reverbs)
        run: |
          cmake --build build --config Release --target seed_archetype_test
          ctest --test-dir build -C Release -R seed_archetype --output-on-failure
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake --build build --config Release --target Seedling_VST3 Seedling_AU -j 4   # VST3 + Audio Unit
          else
            cmake --build build --config Release --target Seedling_VST3 -j 4
          fi
      - name: Audio Unit validation (auval)
        if: runner.os == 'macOS'
        continue-on-error: true          # informational: hosted runners can be too locked down to register AUs
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Seedling_artefacts/Release/AU/Seedling.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i seedl || true
          auval -v aumu Sdl1 SdSy 2>&1 | tail -40
      - uses: actions/upload-artifact@v4
        with:
          name: Seedling-${{ matrix.os }}
          path: |
            build/Seedling_artefacts/Release/VST3/Seedling.vst3
            build/Seedling_artefacts/Release/AU/Seedling.component
          if-no-files-found: error
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $log = "installer-log.txt"
          try {
            choco install innosetup -y --no-progress 2>&1 | Tee-Object -FilePath $log -Append
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
            if (-not $iscc) { $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1 -ExpandProperty FullName }
            "ISCC: $iscc" | Tee-Object -FilePath $log -Append
            $src = (Resolve-Path build/Seedling_artefacts/Release/VST3/Seedling.vst3).Path
            & $iscc "/DSeedVer=$env:VERSION" "/DSrc=$src" installer/windows/seedling.iss 2>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
            Move-Item installer/windows/Seedling-*-Windows-Setup.exe dist/
          } catch {
            "ERROR: $_" | Tee-Object -FilePath $log -Append
            $txt = (Get-Content $log -Tail 40) -join "%0A"
            Write-Host "::error title=Installer step failed::$txt"
            exit 1
          }
      - name: Installer (macOS)
        if: runner.os == 'macOS'
        run: installer/macos/build_pkg.sh "$VERSION" build/Seedling_artefacts/Release/VST3/Seedling.vst3 build/Seedling_artefacts/Release/AU/Seedling.component dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Seedling-installer-${{ matrix.os }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Seedling-installer-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.VERSION) }}
          name: Seedling ${{ env.VERSION }}
          files: dist/*
          generate_release_notes: true
